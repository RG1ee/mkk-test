x-app-env: &app-env
  APP_POSTGRES__HOST: postgres
  APP_POSTGRES__PORT: 5432
  APP_POSTGRES__USER: ${APP_POSTGRES__USER}
  APP_POSTGRES__PASSWORD: ${APP_POSTGRES__PASSWORD}
  APP_POSTGRES__DB: ${APP_POSTGRES__DB}
  APP_RABBITMQ__HOST: rabbitmq
  APP_RABBITMQ__PORT: 5672
  APP_RABBITMQ__USER: ${APP_RABBITMQ__USER}
  APP_RABBITMQ__PASSWORD: ${APP_RABBITMQ__PASSWORD}
  APP_API_KEY: ${APP_API_KEY}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${APP_POSTGRES__USER}
      POSTGRES_PASSWORD: ${APP_POSTGRES__PASSWORD}
      POSTGRES_DB: ${APP_POSTGRES__DB}
    ports:
      - "${APP_POSTGRES__PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_POSTGRES__USER} -d ${APP_POSTGRES__DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${APP_RABBITMQ__USER}
      RABBITMQ_DEFAULT_PASS: ${APP_RABBITMQ__PASSWORD}
    ports:
      - "${APP_RABBITMQ__PORT}:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  outbox-relay:
    build: .
    command: ["python", "-m", "app.workers.outbox_relay"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  consumer:
    build: .
    command: ["python", "-m", "app.workers.consumer"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  rabbitmq_data:
